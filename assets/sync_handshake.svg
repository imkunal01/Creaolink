<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f15" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>

    <linearGradient id="premGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Filters -->
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dashTravel {
        to {
          stroke-dashoffset: -40;
        }
      }
      @keyframes dashReverse {
        to {
          stroke-dashoffset: 40;
        }
      }
      @keyframes pingCode {
        0%, 100% { fill: #00F2FE; }
        50% { fill: #38BDF8; }
      }
      .flow-line-right {
        stroke-dasharray: 6 6;
        animation: dashTravel 1.4s linear infinite;
      }
      .flow-line-left {
        stroke-dasharray: 6 6;
        animation: dashReverse 1.4s linear infinite;
      }
      .code-pulse {
        animation: pingCode 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="880" height="280" rx="14" fill="url(#bgBox)" stroke="#232330" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="440" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">
    ZERO-RENDER SYNCHRONIZATION DATA BUS
  </text>
  <text x="440" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="11" fill="#71717A">
    Instant bi-directional metadata interchange between desktop NLE and web collaborative cloud
  </text>

  <!-- Left Node: Adobe Premiere Pro UXP -->
  <g transform="translate(36, 75)">
    <rect width="230" height="170" rx="12" fill="#14141E" stroke="#990000" stroke-width="1.5" />
    <rect width="230" height="34" rx="12" fill="url(#premGrad)" />
    <rect y="26" width="230" height="8" fill="url(#premGrad)" />
    
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">
      🎬 Premiere Pro (UXP)
    </text>
    <text x="175" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FECACA">
      Editor NLE
    </text>

    <!-- Node Content -->
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#E4E4E7">
      • Native Timeline Hooks
    </text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9CA3AF">
      • Clips, Cuts, Duration &amp; Markers
    </text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9CA3AF">
      • Clean JSON Extractor (No render!)
    </text>
    
    <rect x="16" y="112" width="198" height="38" rx="6" fill="#1D1D2B" stroke="#2F2F44" stroke-width="1" />
    <text x="24" y="127" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#71717A">Payload Size:</text>
    <text x="24" y="141" font-family="ui-monospace, monospace" font-weight="700" font-size="11" fill="#4ADE80">~18 KB (Instant)</text>
    <text x="135" y="134" font-family="ui-monospace, monospace" font-size="9" fill="#9CA3AF">Old: 4.2 GB</text>
  </g>

  <!-- Middle Node: Creaolink Cloud Hub -->
  <g transform="translate(325, 75)">
    <rect width="230" height="170" rx="12" fill="#14141E" stroke="#0284C7" stroke-width="1.5" />
    <rect width="230" height="34" rx="12" fill="url(#cloudGrad)" />
    <rect y="26" width="230" height="8" fill="url(#cloudGrad)" />
    
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">
      ⚡ Creaolink Cloud Core
    </text>
    <text x="175" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#BAE6FD">
      Next.js 16
    </text>

    <!-- Node Content -->
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#E4E4E7">
      • /api/plugin/sync Router
    </text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9CA3AF">
      • Upstash Redis Read-Through
    </text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9CA3AF">
      • Postgres JSONB Timeline Store
    </text>

    <rect x="16" y="112" width="198" height="38" rx="6" fill="#0C1A2E" stroke="#0369A1" stroke-width="1" />
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#38BDF8">ACTIVE 6-DIGIT SYNC PIN:</text>
    <text x="24" y="141" font-family="ui-monospace, monospace" font-weight="900" font-size="13" fill="#00F2FE" class="code-pulse" letter-spacing="2">
      849-201
    </text>
    <circle cx="196" cy="131" r="4" fill="#22C55E" />
  </g>

  <!-- Right Node: Client & Team Web Workspace -->
  <g transform="translate(614, 75)">
    <rect width="230" height="170" rx="12" fill="#14141E" stroke="#059669" stroke-width="1.5" />
    <rect width="230" height="34" rx="12" fill="url(#clientGrad)" />
    <rect y="26" width="230" height="8" fill="url(#clientGrad)" />
    
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">
      🌐 Web Review Room
    </text>
    <text x="165" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#A7F3D0">
      React 19
    </text>

    <!-- Node Content -->
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#E4E4E7">
      • Interactive Timeline UI
    </text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9CA3AF">
      • Timestamped Micro-Feedback
    </text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9CA3AF">
      • Real-time Project Chat &amp; Media
    </text>

    <rect x="16" y="112" width="198" height="38" rx="6" fill="#06241B" stroke="#059669" stroke-width="1" />
    <text x="24" y="127" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#34D399">Status:</text>
    <text x="24" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#E4E4E7">Synced in &lt; 200ms</text>
    <circle cx="196" cy="131" r="4" fill="#22C55E" />
  </g>

  <!-- Data Flow Lines: Left to Middle (Timeline Sync JSON) -->
  <line x1="266" y1="130" x2="325" y2="130" stroke="#00F2FE" stroke-width="2.5" class="flow-line-right" />
  <polygon points="325,130 317,126 317,134" fill="#00F2FE" />
  <text x="295" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#38BDF8">JSON</text>

  <!-- Data Flow Lines: Middle to Left (Feedback Markers) -->
  <line x1="325" y1="165" x2="266" y2="165" stroke="#F43F5E" stroke-width="2" class="flow-line-left" />
  <polygon points="266,165 274,161 274,169" fill="#F43F5E" />
  <text x="295" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#FB7185">NOTES</text>

  <!-- Data Flow Lines: Middle to Right (Rendered Timeline UI) -->
  <line x1="555" y1="130" x2="614" y2="130" stroke="#10B981" stroke-width="2.5" class="flow-line-right" />
  <polygon points="614,130 606,126 606,134" fill="#10B981" />
  <text x="585" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#34D399">CACHE</text>

  <!-- Data Flow Lines: Right to Middle (New Feedback) -->
  <line x1="614" y1="165" x2="555" y2="165" stroke="#F59E0B" stroke-width="2" class="flow-line-left" />
  <polygon points="555,165 563,161 563,169" fill="#F59E0B" />
  <text x="585" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#FBBF24">FEEDBACK</text>
</svg>
