<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0e" />
      <stop offset="50%" stop-color="#121218" />
      <stop offset="100%" stop-color="#09090c" />
    </linearGradient>

    <linearGradient id="primaryRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990008" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Waveform Style -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.03); }
      }
      @keyframes beacon {
        0%, 100% { r: 4px; opacity: 1; }
        50% { r: 7px; opacity: 0.4; }
      }
      @keyframes waveBar {
        0%, 100% { height: 6px; }
        50% { height: 28px; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.9; }
      }
      .pulsing-orb {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .status-dot {
        animation: beacon 2s ease-in-out infinite;
      }
      .border-pulse {
        animation: badgePulse 3s ease-in-out infinite;
      }
      .bar-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
      .bar-2 { animation: waveBar 1.2s ease-in-out infinite 0.3s; }
      .bar-3 { animation: waveBar 1.2s ease-in-out infinite 0.5s; }
      .bar-4 { animation: waveBar 1.2s ease-in-out infinite 0.2s; }
      .bar-5 { animation: waveBar 1.2s ease-in-out infinite 0.6s; }
      .bar-6 { animation: waveBar 1.2s ease-in-out infinite 0.4s; }
      .bar-7 { animation: waveBar 1.2s ease-in-out infinite 0.7s; }
      .bar-8 { animation: waveBar 1.2s ease-in-out infinite 0.2s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#22222a" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="70" r="130" fill="url(#glowGrad)" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="820" cy="180" r="110" fill="#E50914" opacity="0.08" filter="url(#glow)" />
  
  <!-- Subtle Grid Overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
  </g>

  <!-- Brand Icon Logo Badge -->
  <g transform="translate(48, 42)">
    <rect width="58" height="58" rx="14" fill="#181820" stroke="url(#primaryRed)" stroke-width="1.8" class="border-pulse" />
    <!-- Pr + Playhead Fusion Icon -->
    <path d="M 18 16 L 36 29 L 18 42 Z" fill="url(#primaryRed)" filter="url(#softGlow)" />
    <rect x="38" y="16" width="3.5" height="26" rx="1.5" fill="#00F2FE" />
  </g>

  <!-- Main Title & Typographic Hierarchy -->
  <text x="124" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="0.5">
    CREAOLINK
  </text>
  <text x="330" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif" font-weight="600" font-size="13" fill="#E50914" letter-spacing="1.5">
    v2.4 PRO
  </text>

  <text x="124" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif" font-weight="500" font-size="15" fill="#A1A1AA" letter-spacing="0.2">
    Real-Time Adobe Premiere Pro Sync &amp; Creative Review Workspace
  </text>

  <!-- Tagline / Mission -->
  <text x="48" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif" font-weight="400" font-size="13.5" fill="#71717A">
    Eliminating video export overhead with zero-render timeline metadata sync, timestamped review, and instant cloud collaboration.
  </text>

  <!-- Badges / Metrics Row -->
  <g transform="translate(48, 172)">
    <!-- Badge 1: Zero-Render Sync -->
    <rect width="180" height="34" rx="8" fill="#181822" stroke="#2E2E3C" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#00F2FE" class="status-dot" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#E4E4E7">
      ⚡ Zero-Render Sync
    </text>

    <!-- Badge 2: Upstash Redis Tier -->
    <g transform="translate(192, 0)">
      <rect width="180" height="34" rx="8" fill="#181822" stroke="#2E2E3C" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#10B981" class="status-dot" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#E4E4E7">
        🚀 &lt;10ms Cache Tier
      </text>
    </g>

    <!-- Badge 3: Adobe UXP Ready -->
    <g transform="translate(384, 0)">
      <rect width="180" height="34" rx="8" fill="#181822" stroke="#2E2E3C" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#E50914" class="status-dot" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#E4E4E7">
        🎬 Premiere Pro UXP
      </text>
    </g>
  </g>

  <!-- Right Animated Visualizer: Timeline Sync Pulse -->
  <g transform="translate(680, 52)">
    <rect width="170" height="154" rx="12" fill="#14141C" stroke="#262633" stroke-width="1" />
    
    <!-- Mini UI Header -->
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#A1A1AA">
      TIMELINE SYNC FEED
    </text>
    <rect x="124" y="14" width="34" height="14" rx="4" fill="#22C55E" opacity="0.18" />
    <text x="129" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#4ADE80">
      LIVE
    </text>

    <!-- Animated Wave Bars -->
    <g transform="translate(14, 52)" fill="url(#primaryRed)">
      <rect x="0" y="8" width="4" height="16" rx="2" class="bar-1" />
      <rect x="8" y="4" width="4" height="24" rx="2" class="bar-2" />
      <rect x="16" y="10" width="4" height="12" rx="2" class="bar-3" />
      <rect x="24" y="2" width="4" height="28" rx="2" class="bar-4" />
      <rect x="32" y="6" width="4" height="20" rx="2" class="bar-5" />
      <rect x="40" y="12" width="4" height="10" rx="2" class="bar-6" />
      <rect x="48" y="4" width="4" height="24" rx="2" class="bar-7" />
      <rect x="56" y="8" width="4" height="16" rx="2" class="bar-8" />
      <rect x="64" y="2" width="4" height="28" rx="2" class="bar-2" />
      <rect x="72" y="10" width="4" height="12" rx="2" class="bar-4" />
      <rect x="80" y="6" width="4" height="20" rx="2" class="bar-1" />
      <rect x="88" y="12" width="4" height="10" rx="2" class="bar-6" />
      <rect x="96" y="4" width="4" height="24" rx="2" class="bar-3" />
      <rect x="104" y="8" width="4" height="16" rx="2" class="bar-5" />
      <rect x="112" y="2" width="4" height="28" rx="2" class="bar-7" />
      <rect x="120" y="10" width="4" height="12" rx="2" class="bar-8" />
      <rect x="128" y="6" width="4" height="20" rx="2" class="bar-2" />
      <rect x="136" y="4" width="4" height="24" rx="2" class="bar-1" />
    </g>

    <!-- Sync Code Display Box -->
    <rect x="14" y="98" width="142" height="42" rx="8" fill="#1C1C28" stroke="#333345" stroke-width="1" />
    <text x="24" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#71717A">
      SYNC PIN
    </text>
    <text x="24" y="132" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="800" font-size="14" fill="#00F2FE" letter-spacing="3">
      849-201
    </text>
    <circle cx="138" cy="119" r="5" fill="#22C55E" class="status-dot" />
  </g>
</svg>
