<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="320">
  <defs>
    <!-- Dark UI Palette -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121219" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <linearGradient id="v2ClipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="v1ClipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="v1ClipGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="a1ClipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="a2ClipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Filters -->
    <filter id="redPlayheadGlow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes playheadScrub {
        0% { transform: translateX(0px); }
        100% { transform: translateX(640px); }
      }
      @keyframes pulseFeedback {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes markerBlink {
        0%, 100% { fill-opacity: 0.9; }
        50% { fill-opacity: 0.4; }
      }
      .playhead-anim {
        animation: playheadScrub 9s linear infinite;
      }
      .feedback-bubble {
        animation: pulseFeedback 2.5s ease-in-out infinite;
        transform-origin: 430px 45px;
      }
      .marker-pulse {
        animation: markerBlink 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer Dashboard Window Frame -->
  <rect width="880" height="320" rx="14" fill="url(#panelBg)" stroke="#232330" stroke-width="1.5" />

  <!-- Window Header / Top Bar -->
  <rect width="880" height="42" rx="14" fill="#181822" />
  <rect y="36" width="880" height="6" fill="#181822" />
  <line x1="0" y1="42" x2="880" y2="42" stroke="#2a2a38" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="22" cy="21" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="38" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="54" cy="21" r="5" fill="#10B981" opacity="0.8" />

  <!-- Sequence Meta in Top Bar -->
  <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#E4E4E7">
    Timeline Viewer — <tspan fill="#A1A1AA" font-weight="500">Promo_Commercial_v4.prproj</tspan>
  </text>

  <!-- Sequence Stats Chips -->
  <g transform="translate(560, 11)">
    <rect width="90" height="20" rx="4" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="0.8" />
    <text x="45" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="10" fill="#2DD4BF">
      ⏱ 00:03:42:15
    </text>
  </g>
  <g transform="translate(660, 11)">
    <rect width="64" height="20" rx="4" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="0.8" />
    <text x="32" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#60A5FA">
      24 FPS
    </text>
  </g>
  <g transform="translate(734, 11)">
    <rect width="130" height="20" rx="4" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#22C55E" />
    <text x="70" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="10" fill="#4ADE80">
      ⚡ UXP SYNC LIVE
    </text>
  </g>

  <!-- Left Track Headers Column -->
  <rect x="0" y="42" width="120" height="278" fill="#13131B" stroke="#242432" stroke-width="1" />

  <!-- Timecode Ruler Background -->
  <rect x="120" y="42" width="760" height="28" fill="#161622" stroke="#242432" stroke-width="1" />
  
  <!-- Ruler Marks -->
  <g fill="#71717A" font-family="ui-monospace, monospace" font-size="9" font-weight="600">
    <text x="140" y="60">00:00:00</text>
    <line x1="140" y1="64" x2="140" y2="70" stroke="#3F3F46" stroke-width="1" />

    <text x="260" y="60">00:00:45</text>
    <line x1="260" y1="64" x2="260" y2="70" stroke="#3F3F46" stroke-width="1" />

    <text x="390" y="60">00:01:30</text>
    <line x1="390" y1="64" x2="390" y2="70" stroke="#3F3F46" stroke-width="1" />

    <text x="520" y="60">00:02:15</text>
    <line x1="520" y1="64" x2="520" y2="70" stroke="#3F3F46" stroke-width="1" />

    <text x="650" y="60">00:03:00</text>
    <line x1="650" y1="64" x2="650" y2="70" stroke="#3F3F46" stroke-width="1" />

    <text x="780" y="60">00:03:45</text>
    <line x1="780" y1="64" x2="780" y2="70" stroke="#3F3F46" stroke-width="1" />
  </g>

  <!-- Track 1: V2 (Adjustment / Overlay) -->
  <g transform="translate(0, 70)">
    <rect width="120" height="48" fill="#14141E" stroke="#22222E" stroke-width="1" />
    <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#C4B5FD">V2</text>
    <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#71717A">Titles &amp; FX</text>

    <!-- Track lane -->
    <rect x="120" y="0" width="760" height="48" fill="#0E0E15" stroke="#1C1C26" stroke-width="1" />
    <!-- Clips in V2 -->
    <g transform="translate(240, 6)">
      <rect width="170" height="36" rx="5" fill="url(#v2ClipGrad)" stroke="#A78BFA" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">
        LowerThird_Motion.mogrt
      </text>
    </g>
    <g transform="translate(560, 6)">
      <rect width="140" height="36" rx="5" fill="url(#v2ClipGrad)" stroke="#A78BFA" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">
        CallToAction_3D.mogrt
      </text>
    </g>
  </g>

  <!-- Track 2: V1 (Primary Video Track) -->
  <g transform="translate(0, 120)">
    <rect width="120" height="56" fill="#14141E" stroke="#22222E" stroke-width="1" />
    <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#93C5FD">V1</text>
    <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#71717A">Main Footage</text>

    <!-- Track lane -->
    <rect x="120" y="0" width="760" height="56" fill="#0B0B11" stroke="#1C1C26" stroke-width="1" />
    <!-- Clips in V1 -->
    <g transform="translate(130, 6)">
      <rect width="140" height="44" rx="5" fill="url(#v1ClipGrad)" stroke="#60A5FA" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#FFFFFF">
        01_Hook_Intro.mp4
      </text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="8.5" fill="#BFDBFE">
        00:00 - 00:42
      </text>
    </g>
    <g transform="translate(274, 6)">
      <rect width="210" height="44" rx="5" fill="url(#v1ClipGrad2)" stroke="#60A5FA" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#FFFFFF">
        02_Interview_CamA.mov
      </text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="8.5" fill="#BFDBFE">
        00:42 - 01:45
      </text>
    </g>
    <g transform="translate(488, 6)">
      <rect width="190" height="44" rx="5" fill="url(#v1ClipGrad)" stroke="#60A5FA" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#FFFFFF">
        03_BRoll_BakeSequence.broll
      </text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="8.5" fill="#BFDBFE">
        01:45 - 02:42
      </text>
    </g>
    <g transform="translate(682, 6)">
      <rect width="170" height="44" rx="5" fill="url(#v1ClipGrad2)" stroke="#60A5FA" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#FFFFFF">
        04_Outro_Sponsor.mp4
      </text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="8.5" fill="#BFDBFE">
        02:42 - 03:42
      </text>
    </g>
  </g>

  <!-- Track 3: A1 (Dialogue Audio) -->
  <g transform="translate(0, 178)">
    <rect width="120" height="48" fill="#14141E" stroke="#22222E" stroke-width="1" />
    <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#6EE7B7">A1</text>
    <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#71717A">Dialogue Lav</text>

    <!-- Track lane -->
    <rect x="120" y="0" width="760" height="48" fill="#0E0E15" stroke="#1C1C26" stroke-width="1" />
    <!-- Audio Clips -->
    <g transform="translate(130, 6)">
      <rect width="354" height="36" rx="5" fill="url(#a1ClipGrad)" stroke="#34D399" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">
        Mic_Wireless_Cleaned.wav [Normalized -14 LUFS]
      </text>
    </g>
    <g transform="translate(488, 6)">
      <rect width="364" height="36" rx="5" fill="url(#a1ClipGrad)" stroke="#34D399" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">
        VoiceOver_Mastered.wav
      </text>
    </g>
  </g>

  <!-- Track 4: A2 (Music & SFX) -->
  <g transform="translate(0, 228)">
    <rect width="120" height="48" fill="#14141E" stroke="#22222E" stroke-width="1" />
    <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#FCD34D">A2</text>
    <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#71717A">Soundtrack &amp; SFX</text>

    <!-- Track lane -->
    <rect x="120" y="0" width="760" height="48" fill="#0B0B11" stroke="#1C1C26" stroke-width="1" />
    <!-- Music Clips -->
    <g transform="translate(130, 6)">
      <rect width="722" height="36" rx="5" fill="url(#a2ClipGrad)" stroke="#FBBF24" stroke-width="0.8" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">
        Upbeat_Tech_Inspire_BPM128.mp3 [Ducking: -18dB]
      </text>
    </g>
  </g>

  <!-- Markers Pins on Ruler -->
  <!-- Marker 1 (Green at 00:45) -->
  <g transform="translate(260, 44)">
    <polygon points="0,0 8,0 4,7" fill="#10B981" filter="url(#pinGlow)" class="marker-pulse" />
  </g>

  <!-- Marker 2 (Red at 01:30 - Has Open Client Feedback) -->
  <g transform="translate(390, 44)">
    <polygon points="0,0 8,0 4,7" fill="#EF4444" filter="url(#pinGlow)" class="marker-pulse" />
  </g>

  <!-- Interactive Feedback Tooltip floating over Marker 2 -->
  <g transform="translate(280, 240)" class="feedback-bubble">
    <rect width="270" height="66" rx="8" fill="#1F1F2C" stroke="#EF4444" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#EF4444" />
    <text x="26" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="10.5" fill="#FCA5A5">
      CLIENT FEEDBACK @ 00:01:30
    </text>
    <text x="235" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="9" fill="#EF4444">
      HIGH PRIORITY
    </text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#E4E4E7">
      "Please boost dialogue gain and trim 2s of pause before B-Roll cut."
    </text>
    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="8.5" fill="#9CA3AF">
      Left by Sarah (Client) • Linked to Version v4
    </text>
  </g>

  <!-- Animated Playhead Scrubber -->
  <g transform="translate(140, 42)" class="playhead-anim">
    <!-- Red line spanning across all tracks -->
    <line x1="0" y1="0" x2="0" y2="236" stroke="#EF4444" stroke-width="2" filter="url(#redPlayheadGlow)" />
    <!-- Playhead Top Needle Head -->
    <polygon points="-7,0 7,0 7,12 0,18 -7,12" fill="#EF4444" />
    <circle cx="0" cy="7" r="2" fill="#FFFFFF" />
  </g>
</svg>
